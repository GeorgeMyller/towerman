# Towerman: apps do iPhone, do Apple Watch e do Mac num só projeto.
# Gerar: xcodegen generate (cria Towerman.xcodeproj).
# A equipa e os IDs (bundle, App Group, Keychain) vêm de Config/Towerman.xcconfig, com os
# valores de cada um em Config/Local.xcconfig (ver Config/Local.xcconfig.example).
name: Towerman
configFiles:
  Debug: Config/Towerman.xcconfig
  Release: Config/Towerman.xcconfig
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # O relógio usa o toque duplo, a Smart Stack e o Centro de Controlo: watchOS 26 no mínimo.
    WATCHOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # A versão é a do servidor (internal/config/config.go), sem o sufixo -rc. O número de build cresce a cada commit
    # (script «Número de build»): com o mesmo número, o iOS guarda o ícone velho nas notificações.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Towerman:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - Info.plist
      - path: Shared
      - path: LiveActivity/TowerActivityAttributes.swift
    dependencies:
      - target: TowermanWatch
        embed: true
        codeSign: true
      - target: TowermanLive
        embed: true
        codeSign: true
      - target: TowermanNotificationService
        embed: true
        codeSign: true
    entitlements:
      path: iOS/Towerman.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TOWERMAN_SHARED_ID).shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        # Grupo de Keychain partilhado com a extensão de notificação (chaves do relay).
        TowermanKeychainGroup: $(AppIdentifierPrefix)$(TOWERMAN_SHARED_ID).shared
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Fora de casa, pelo Tailscale: o nome MagicDNS (*.ts.net) é um domínio completo, e o
          # ATS recusaria HTTP. O túnel do Tailscale já é cifrado (WireGuard).
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: O Towerman conecta-se aos seus computadores na rede local para mostrar os agentes.
        NSCameraUsageDescription: O Towerman usa a câmera para ler o QR de pareamento do seu computador.
        NSBonjourServices:
          - _towerman._tcp
        CFBundleURLTypes:
          - CFBundleURLName: $(TOWERMAN_SHARED_ID).pair
            CFBundleURLSchemes:
              - towerman
    settings:
      base:
        PRODUCT_NAME: Towerman
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_IOS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  TowermanWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - Info.plist
      - path: Shared
      - path: WatchWidgets/TowerIntents.swift
    dependencies:
      - target: TowermanWatchWidgets
        embed: true
        codeSign: true
    entitlements:
      path: WatchApp/TowermanWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TOWERMAN_APP_GROUP)
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        WKCompanionAppBundleIdentifier: $(TOWERMAN_IOS_BUNDLE_ID)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_NAME: TowermanWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_IOS_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Live Activity do iPhone; o watchOS mostra-a na Smart Stack (formato .small).
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  TowermanLive:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TowermanLive
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_IOS_BUNDLE_ID).live

  # Decifra o push das decisões em texto livre e mostra-as com botões (o relógio recebe-a espelhada).
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  TowermanNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Info.plist
      - path: Shared/AgentModels.swift
      - path: Shared/RelayCrypto.swift
      - path: Shared/TowermanIDs.swift
      - path: iOS/DecisionNotification.swift
    entitlements:
      path: NotificationService/TowermanNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TOWERMAN_SHARED_ID).shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        TowermanKeychainGroup: $(AppIdentifierPrefix)$(TOWERMAN_SHARED_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: TowermanNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_IOS_BUNDLE_ID).notifications

  # Complicações, Smart Stack e controlo do Centro de Controlo no relógio.
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  TowermanWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
    entitlements:
      path: WatchWidgets/TowermanWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TOWERMAN_APP_GROUP)
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: TowermanWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_IOS_BUNDLE_ID).watchkitapp.widgets
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

  TowermanMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes:
          - Info.plist
      - path: Shared/AgentModels.swift
      - path: Shared/TowerTheme.swift
      - path: Shared/SwipeActions.swift
      - path: Shared/QuickReplies.swift
      - path: Shared/RelayCrypto.swift
      - path: Shared/TowermanIDs.swift
      - path: Shared/LaunchModels.swift
      - path: iOS/ServerLink.swift
    info:
      path: Mac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Towerman
        # Lidos pelo Swift (TowermanIDs): App Group e base dos serviços do Keychain.
        TowermanAppGroup: $(TOWERMAN_APP_GROUP)
        TowermanSharedID: $(TOWERMAN_SHARED_ID)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: O Towerman conecta-se aos seus computadores na rede local para mostrar os agentes.
        NSBonjourServices:
          - _towerman._tcp
        NSAppleEventsUsageDescription: O Towerman escreve no Terminal e no iTerm2 a resposta que der no relógio ou no iPhone a uma sessão parada.
    settings:
      base:
        PRODUCT_NAME: Towerman
        PRODUCT_BUNDLE_IDENTIFIER: $(TOWERMAN_MAC_BUNDLE_ID)
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: Servidor Towerman dentro do app
        basedOnDependencyAnalysis: false
        script: |
          # Compila o towerman (repositório ao lado, ou TOWERMAN_SRC) para dentro do app e assina-o.
          set -e
          SRC="${TOWERMAN_SRC:-$SRCROOT/..}"
          export PATH="/opt/homebrew/bin:/usr/local/go/bin:/usr/local/bin:$PATH"
          if [ ! -f "$SRC/go.mod" ] || ! command -v go >/dev/null; then
            echo "warning: towerman não compilado (sem $SRC ou sem go); o app usa o servidor que houver"
            exit 0
          fi
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/towerman-cli"
          # Universal (arm64 + x86_64), como o app: o DMG também serve para os Mac Intel.
          for ARCH in arm64 amd64; do
            (cd "$SRC" && CGO_ENABLED=0 GOOS=darwin GOARCH=$ARCH go build -trimpath -o "$DERIVED_FILE_DIR/towerman-$ARCH" ./cmd/towerman)
          done
          lipo -create -output "$DEST" "$DERIVED_FILE_DIR/towerman-arm64" "$DERIVED_FILE_DIR/towerman-amd64"
          if [ "$CODE_SIGNING_ALLOWED" = "YES" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST"
          fi
    postBuildScripts:
      - name: Número de build
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Número de build = commits do repositório; o app e as extensões ficam com o mesmo.
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"

schemes:
  Towerman:
    build:
      targets:
        Towerman: all
        TowermanWatch: all
    run:
      config: Debug
  TowermanWatch:
    build:
      targets:
        TowermanWatch: all
    run:
      config: Debug
  TowermanMac:
    build:
      targets:
        TowermanMac: all
    run:
      config: Debug
